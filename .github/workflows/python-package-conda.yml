name: Chatbot Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8
      - name: Check Python syntax
        run: python -m compileall -q app.py setup_model.py
      - name: Lint critical errors
        run: flake8 app.py setup_model.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests
        run: pytest -q
